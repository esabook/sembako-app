<!doctype html>
<html lang="id" data-theme="dark">

<head>
	<title>Stokasir</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<link rel="apple-touch-icon" href="/logo.webp" />
	<!-- Skin 'normal' (default) inline — hapus request /themes/normal.css dari critical path.
	     SUMBER KEBENARAN: static/themes/normal.css — sinkronkan bila token berubah. -->
	<style>
		[data-theme='dark']{--bg:#000000;--surface:#272729;--surface2:#2a2a2c;--border:#3a3a3c;--text:#ffffff;--text-dim:#cccccc;--accent:#2997ff;--warn:#ff9f0a;--danger:#ff453a;--info:#64d2ff;--skeleton:#1c1c1e}
		[data-theme='light']{--bg:#ffffff;--surface:#f5f5f7;--surface2:#fafafc;--border:#e0e0e0;--text:#1d1d1f;--text-dim:#7a7a7a;--accent:#0066cc;--warn:#b37800;--danger:#c62828;--info:#0066cc;--skeleton:#e8e8ed}
	</style>
	<!-- Resolve tema + skin sebelum paint → cegah FOUC/flash. -->
	<script>
		(function(){
			var s = localStorage.getItem('tema_skin') || 'normal';
			var m = localStorage.getItem('tema_mode') || 'system';
			var gelap = m === 'dark' ? true : m === 'light' ? false : window.matchMedia('(prefers-color-scheme: dark)').matches;
			var t;
			if (s === 'bw') t = gelap ? 'bwb' : 'bww';
			else if (s === 'island') t = gelap ? 'island' : 'islandl';
			else if (s === 'klasik') t = gelap ? 'klasik' : 'klasikl';
			else if (s === 'lambo') t = gelap ? 'lambo' : 'lambol';
			else t = gelap ? 'dark' : 'light';
			document.documentElement.setAttribute('data-theme', t);
			var darkV = ['dark','bwb','island','klasik','lambo'];
			document.documentElement.classList.toggle('dark', darkV.indexOf(t) >= 0);
			if (s !== 'normal') {
				var l = document.createElement('link');
				l.rel = 'stylesheet';
				l.id = 'skin-css';
				l.href = '/themes/' + s + '.css';
				document.head.appendChild(l);
			}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
