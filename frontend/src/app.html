<!doctype html>
<html lang="id" data-theme="dark">

<head>
	<title>Stokasir</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<link rel="apple-touch-icon" href="/logo.webp" />
	<!-- Skin 'normal' (default) inline — hapus request /themes/normal.css dari critical path.
	     SUMBER KEBENARAN: static/themes/normal.css — sinkronkan bila token berubah. -->
	<style>
		[data-theme='dark']{--bg:#000000;--surface:#272729;--surface2:#2a2a2c;--border:#3a3a3c;--text:#ffffff;--text-dim:#cccccc;--accent:#2997ff;--warn:#ff9f0a;--danger:#ff453a;--info:#64d2ff;--skeleton:#1c1c1e}
		[data-theme='light']{--bg:#ffffff;--surface:#f5f5f7;--surface2:#fafafc;--border:#e0e0e0;--text:#1d1d1f;--text-dim:#7a7a7a;--accent:#0066cc;--warn:#b37800;--danger:#c62828;--info:#0066cc;--skeleton:#e8e8ed}
	</style>
	<!-- Skin non-default: load sebelum paint untuk hindari FOUC. Normal sudah inline di atas. -->
	<script>
		(function(){
			var s = localStorage.getItem('tema_skin') || 'normal';
			if (s === 'normal') return;
			var l = document.createElement('link');
			l.rel = 'stylesheet';
			l.id = 'skin-css';
			l.href = '/themes/' + s + '.css';
			document.head.appendChild(l);
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
