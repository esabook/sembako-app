name = "stokasir-backend"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[alias]
"bun:sqlite" = "./src/db/stubs/bun-sqlite.ts"

# Ganti YOUR_D1_DATABASE_ID setelah: bunx wrangler d1 create stokasir
[[d1_databases]]
binding = "DB"
database_name = "stokasir"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "src/db/migrations/sqlite"

[vars]
DATABASE_URL = "d1://"
JWT_EXPIRY_HOURS = "12"
FRONTEND_URL = "https://your-frontend.pages.dev"
SAAS_GATING = "0"
STORAGE_DRIVER = "r2"
UPLOAD_DIR = ""
S3_ENDPOINT = ""
S3_REGION = "auto"
S3_BUCKET = ""
S3_ACCESS_KEY_ID = ""
S3_SECRET_ACCESS_KEY = ""
S3_PUBLIC_URL = ""
PLATFORM_ADMIN_USER = "superadmin"
PLATFORM_ADMIN_PASSWORD = "ganti-ini"

# Secrets — simpan via: bunx wrangler secret put JWT_SECRET
# JWT_SECRET wajib di-set sebagai secret (bukan [vars])

[dev]
port = 8787
local_protocol = "http"
