name = "stokasir-backend"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[alias]
"bun:sqlite" = "./src/db/stubs/bun-sqlite.ts"

# Ganti YOUR_D1_DATABASE_ID setelah: bunx wrangler d1 create stokasir
[[kv_namespaces]]
binding = "KV"
# id = ""  # bunx wrangler kv namespace create stokasir-cache

[[d1_databases]]
binding = "DB"
# database_name = "stokasir"
# database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "src/db/migrations/sqlite"

# DB demo terpisah — sandbox bisa di-reset tanpa risiko ke prod.
[[d1_databases]]
binding = "DB_DEMO"
# database_name = "stokasir_demo"
# database_id = "YOUR_DEMO_D1_DATABASE_ID"
migrations_dir = "src/db/migrations/sqlite"

# Durable Object: koordinator scan-relay (WebSocket Hibernation)
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDO"]   # SQLite-backed = free tier

[vars]
DATABASE_URL = "d1://"
DEMO_DATABASE_URL = "d1://"
JWT_EXPIRY_HOURS = "12"
# FRONTEND_URL = "https://yours.pages.dev,http://localhost:5173"
SAAS_GATING = "1"
NODE_ENV = "production"
STORAGE_DRIVER = "r2"
UPLOAD_DIR = ""
S3_ENDPOINT = ""
S3_REGION = "auto"
S3_BUCKET = ""
S3_ACCESS_KEY_ID = ""
S3_SECRET_ACCESS_KEY = ""
S3_PUBLIC_URL = ""
# PLATFORM_ADMIN_USER = "superadmin"
# PLATFORM_ADMIN_PASSWORD = "admin123"

# Secrets — simpan via: bunx wrangler secret put JWT_SECRET
# JWT_SECRET wajib di-set sebagai secret (bukan [vars])

[dev]
port = 8787
local_protocol = "http"

[observability.logs]
enabled = true
invocation_logs = true
