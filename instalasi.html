<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stokasir — Installer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0e16;
      --surface:  #141720;
      --surface2: #1d2133;
      --border:   #252940;
      --text:     #dde1f0;
      --dim:      #5a607a;
      --accent:   #7c3aed;
      --accent2:  #6d28d9;
      --ok:       #22c55e;
      --err:      #ef4444;
      --warn:     #f59e0b;
      --info:     #60a5fa;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; }
    .logo span { color: var(--accent); }
    .os-badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--dim);
    }

    /* ── Layout ── */
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 0;
      height: calc(100vh - 57px);
    }

    /* ── Left: Config ── */
    .config-panel {
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-transform: uppercase;
    }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.75rem; color: var(--dim); }
    input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.55rem 0.75rem;
      width: 100%;
      transition: border-color .15s;
      outline: none;
    }
    input:focus { border-color: var(--accent); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .btn-install {
      margin-top: auto;
      padding: 0.85rem 1rem;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn-install:hover:not(:disabled) { background: var(--accent2); }
    .btn-install:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Right: Progress ── */
    .progress-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Steps */
    .steps {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      color: var(--dim);
      transition: color .2s;
    }
    .step-icon {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      transition: all .2s;
      flex-shrink: 0;
    }
    .step.active  { color: var(--text); }
    .step.active .step-icon  { border-color: var(--accent); color: var(--accent); background: rgba(124,58,237,.15); }
    .step.done   { color: var(--ok); }
    .step.done .step-icon    { border-color: var(--ok); color: var(--ok); background: rgba(34,197,94,.1); }
    .step.error  { color: var(--err); }
    .step.error .step-icon   { border-color: var(--err); color: var(--err); background: rgba(239,68,68,.1); }

    .step-sep { color: var(--border); font-size: 0.8rem; align-self: center; }

    /* Log */
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      font-size: 0.75rem;
      line-height: 1.7;
      background: var(--bg);
    }

    .log-line { display: block; }
    .log-line.cmd  { color: var(--info); }
    .log-line.ok   { color: var(--ok); }
    .log-line.err  { color: var(--err); }
    .log-line.dim  { color: var(--dim); }
    .log-line.step { color: var(--accent); font-weight: 700; margin-top: 0.5rem; }

    /* Done banner */
    .done-banner {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .done-banner.visible { display: flex; }
    .done-title { font-size: 1.1rem; font-weight: 700; color: var(--ok); }
    .done-url   { font-size: 0.8rem; color: var(--dim); }
    .done-url a { color: var(--accent); text-decoration: none; }
    .done-url a:hover { text-decoration: underline; }
    .btn-open {
      padding: 0.6rem 1.5rem;
      background: var(--ok);
      border: none; border-radius: 6px;
      color: #000; font-family: inherit; font-size: 0.8rem; font-weight: 700;
      cursor: pointer;
    }
    .btn-open:hover { opacity: .85; }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--dim);
      font-size: 0.8rem;
    }
    .empty-state .arrow { font-size: 2rem; }

    /* Error banner */
    .err-banner {
      display: none;
      padding: 0.75rem 1.5rem;
      background: rgba(239,68,68,.1);
      border-top: 1px solid var(--err);
      color: var(--err);
      font-size: 0.75rem;
    }
    .err-banner.visible { display: block; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    /* Responsive */
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
      .config-panel { border-right: none; border-bottom: 1px solid var(--border); }
      .progress-panel { min-height: 50vh; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><span>Stokasir</span> — Installer</div>
  <span class="os-badge" id="os-badge">mendeteksi OS...</span>
</header>

<main>
  <!-- ── Config Panel ── -->
  <div class="config-panel">
    <div class="panel-title">Konfigurasi</div>

    <div class="field">
      <label>Folder data (database & upload)</label>
      <input id="dataDir" type="text" placeholder="/home/user/stokasir-data">
    </div>

    <div class="field">
      <label>IP server (untuk akses HP di LAN)</label>
      <input id="serverIp" type="text" placeholder="192.168.1.x">
    </div>

    <div class="field">
      <label>JWT Secret <span style="color:var(--dim)">← generate otomatis jika kosong</span></label>
      <input id="jwtSecret" type="text" placeholder="(kosongkan untuk generate otomatis)">
    </div>

    <div class="row">
      <div class="field">
        <label>Port backend</label>
        <input id="portBackend" type="text" value="3000">
      </div>
      <div class="field">
        <label>Port frontend</label>
        <input id="portFrontend" type="text" value="5173">
      </div>
    </div>

    <button class="btn-install" id="btn-install" onclick="startInstall()">
      Mulai Instalasi
    </button>
  </div>

  <!-- ── Progress Panel ── -->
  <div class="progress-panel" id="progress-panel">

    <div class="steps" id="steps">
      <div class="step" id="step-1">
        <div class="step-icon">1</div>Verifikasi Bun
      </div>
      <div class="step-sep">›</div>
      <div class="step" id="step-2">
        <div class="step-icon">2</div>Siapkan Folder
      </div>
      <div class="step-sep">›</div>
      <div class="step" id="step-3">
        <div class="step-icon">3</div>Install Backend
      </div>
      <div class="step-sep">›</div>
      <div class="step" id="step-4">
        <div class="step-icon">4</div>Build Frontend
      </div>
      <div class="step-sep">›</div>
      <div class="step" id="step-5">
        <div class="step-icon">5</div>Setup Service
      </div>
    </div>

    <div class="log-area" id="log-area">
      <div class="empty-state" id="empty-state">
        <div class="arrow">←</div>
        <div>Isi konfigurasi lalu klik <strong>Mulai Instalasi</strong></div>
      </div>
    </div>

    <div class="err-banner" id="err-banner"></div>

    <div class="done-banner" id="done-banner">
      <div class="done-title">✓ Instalasi Selesai!</div>
      <div class="done-url" id="done-url"></div>
      <button class="btn-open" id="btn-open" onclick="openApp()">Buka Stokasir</button>
    </div>

  </div>
</main>

<script>
  let appUrl = ''

  // ── Load platform info ──────────────────────────────────────────────────────
  async function loadPlatform() {
    try {
      const res  = await fetch('/api/platform')
      const info = await res.json()

      const badge = document.getElementById('os-badge')
      badge.textContent = `${info.os} · ${info.arch} · Bun ${info.bunVersion}`

      if (!document.getElementById('dataDir').value) {
        document.getElementById('dataDir').value = info.defaultData
      }
      if (!document.getElementById('serverIp').value) {
        document.getElementById('serverIp').value = info.ip
      }
    } catch {
      document.getElementById('os-badge').textContent = 'server tidak berjalan'
      document.getElementById('os-badge').style.color = 'var(--err)'
    }
  }

  // ── Generate JWT secret ─────────────────────────────────────────────────────
  function generateJwt() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*'
    const arr   = new Uint8Array(48)
    crypto.getRandomValues(arr)
    return Array.from(arr, b => chars[b % chars.length]).join('')
  }

  // ── Start install ───────────────────────────────────────────────────────────
  async function startInstall() {
    const cfg = {
      dataDir:      document.getElementById('dataDir').value.trim(),
      serverIp:     document.getElementById('serverIp').value.trim(),
      jwtSecret:    document.getElementById('jwtSecret').value.trim() || generateJwt(),
      portBackend:  document.getElementById('portBackend').value.trim() || '3000',
      portFrontend: document.getElementById('portFrontend').value.trim() || '5173',
    }

    if (!cfg.dataDir || !cfg.serverIp) {
      alert('Folder data dan IP server wajib diisi.')
      return
    }

    // Reset UI
    document.getElementById('btn-install').disabled = true
    document.getElementById('empty-state').style.display = 'none'
    document.getElementById('err-banner').classList.remove('visible')
    document.getElementById('done-banner').classList.remove('visible')
    document.getElementById('log-area').innerHTML = ''

    resetSteps()

    try {
      const res = await fetch('/api/install', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(cfg),
      })

      await readSSE(res)
    } catch (err) {
      showError(String(err))
    }
  }

  // ── SSE reader ──────────────────────────────────────────────────────────────
  async function readSSE(response) {
    const reader  = response.body.getReader()
    const decoder = new TextDecoder()
    let buf = ''

    while (true) {
      const { done, value } = await reader.read()
      if (done) break

      buf += decoder.decode(value, { stream: true })
      const messages = buf.split('\n\n')
      buf = messages.pop() ?? ''

      for (const msg of messages) {
        for (const line of msg.split('\n')) {
          if (!line.startsWith('data: ')) continue
          try {
            handleEvent(JSON.parse(line.slice(6)))
          } catch {}
        }
      }
    }
  }

  // ── Event handler ───────────────────────────────────────────────────────────
  function handleEvent(e) {
    if (e.type === 'step') {
      setStep(e.step, 'active')
      addLog(`── ${e.name} ──`, 'step')
    } else if (e.type === 'step-done') {
      setStep(e.step, 'done')
    } else if (e.type === 'log') {
      const t = e.text
      let cls = ''
      if (t.startsWith('$'))       cls = 'cmd'
      else if (t.startsWith('✓'))  cls = 'ok'
      else if (t.match(/error/i))  cls = 'err'
      else if (t.startsWith(' ') || t.startsWith('\t')) cls = 'dim'
      addLog(t, cls)
    } else if (e.type === 'done') {
      appUrl = e.url
      showDone(e.url)
    } else if (e.type === 'error') {
      showError(e.message)
    }
  }

  // ── UI helpers ──────────────────────────────────────────────────────────────
  function addLog(text, cls) {
    const area = document.getElementById('log-area')
    const span = document.createElement('span')
    span.className = `log-line${cls ? ' ' + cls : ''}`
    span.textContent = text
    area.appendChild(span)
    area.appendChild(document.createElement('br'))
    area.scrollTop = area.scrollHeight
  }

  function resetSteps() {
    for (let i = 1; i <= 5; i++) {
      const el = document.getElementById(`step-${i}`)
      el.className = 'step'
      el.querySelector('.step-icon').textContent = String(i)
    }
  }

  function setStep(n, state) {
    const el   = document.getElementById(`step-${n}`)
    const icon = el.querySelector('.step-icon')
    el.className = `step ${state}`
    if (state === 'active') {
      icon.innerHTML = '<div class="spinner"></div>'
    } else if (state === 'done') {
      icon.textContent = '✓'
    } else if (state === 'error') {
      icon.textContent = '✗'
    }
  }

  function showDone(url) {
    const banner = document.getElementById('done-banner')
    document.getElementById('done-url').innerHTML =
      `Akses Stokasir di: <a href="${url}" target="_blank">${url}</a>`
    banner.classList.add('visible')
    document.getElementById('btn-install').disabled = false
    document.getElementById('btn-install').textContent = 'Install Ulang'
  }

  function showError(msg) {
    // Mark active step as error
    for (let i = 1; i <= 5; i++) {
      const el = document.getElementById(`step-${i}`)
      if (el.classList.contains('active')) setStep(i, 'error')
    }
    const banner = document.getElementById('err-banner')
    banner.textContent = `✗ Error: ${msg}`
    banner.classList.add('visible')
    document.getElementById('btn-install').disabled = false
    document.getElementById('btn-install').textContent = 'Coba Lagi'
    addLog(`✗ ${msg}`, 'err')
  }

  function openApp() {
    if (appUrl) window.open(appUrl, '_blank')
    // Stop installer server
    fetch('/api/stop').catch(() => {})
  }

  // ── Init ────────────────────────────────────────────────────────────────────
  loadPlatform()
</script>
</body>
</html>
